<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta name="robots" content="noindex" />
  <title>TattooAR — Página no encontrada</title>
  <script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ta:theme')||'dark');}catch(e){}
    // La 404 se sirve en cualquier ruta: fija la base del sitio (raíz, o /repo/ en GitHub Pages) para que carguen los estilos.
    var seg=location.pathname.split('/')[1], base=/github\.io$/.test(location.hostname)&&seg?'/'+seg+'/':'/';
    document.write('<base href="'+base+'">');})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@800&family=Inter+Tight:wght@400;500;600&family=Space+Grotesk:wght@600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/landing.css?v=4" />
  <link rel="stylesheet" href="css/brand.css?v=3" />
  <script src="js/brand-logo.js?v=4"></script>
  <style>
    .nf { min-height: 100dvh; display: grid; place-items: center; padding: 2rem var(--gut); overflow: hidden; position: relative; }
    .nf-in { position: relative; display: grid; justify-items: start; gap: 1.1rem; width: min(100%, 560px); }
    .nf .nf-code { font-family: var(--mono); font-weight: 700; font-size: clamp(4.5rem, 20vw, 9rem); line-height: .9; letter-spacing: -.07em; color: var(--accent-text); }
    .nf-code i { font-style: normal; animation: tal-blink 1.1s steps(1) infinite; }
    .nf h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.05; letter-spacing: -.04em; max-width: 18ch; }
    .nf p { color: var(--muted); max-width: 40ch; }
    .nf-ghost { position: absolute; left: -10vw; right: -20vw; bottom: 4%; pointer-events: none; }
    .nf-ghost [data-ta-logo] { display: block; width: 100%; --tal-word: var(--ghost) !important; }
    .nf .hero-ctas { margin-top: .8rem; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-ghost" aria-hidden="true"><span data-ta-logo="word" data-glitch="off"></span></div>
    <div class="nf-in">
      <a href="./" aria-label="TattooAR — inicio"><span data-ta-logo="horizontal" style="width:130px" aria-hidden="true"></span></a>
      <p class="nf-code" aria-hidden="true">404<i>_</i></p>
      <h1>Esta página se borró como un tatuaje con láser.</h1>
      <p>El link está mal escrito o ya no existe. Si te lo pasó tu tatuador, pedile uno nuevo.</p>
      <div class="hero-ctas">
        <a class="btn btn-accent" href="./">Volver al inicio</a>
        <a class="link-arrow" href="scan.html">Abrir el escáner</a>
      </div>
    </div>
  </main>
</body>
</html>
